version: "3.8"
services:
  mongodb:
    image: mongo:latest
    container_name : mongofb
    networks:
      - flask-net
    volumes:
      - car_vol:/data/db

  flaskapp:
    build: .
    container_name: car_racer
    ports:
      - "5000:5000"
    networks: 
      - flask-net
    environment:
      MONGO_URI: mongodb://mongofb:27017/devops_project
    depends_on:
      - mongodb
  
volumes:
  car_vol:
networks:
  flask-net:
