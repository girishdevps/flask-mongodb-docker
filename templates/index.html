
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Racer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #22c55e;
    margin-top: 20px;
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    padding: 20px;
}

canvas {
    background: #333;
    border: 4px solid white;
    border-radius: 10px;
}

.panel {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    min-width: 250px;
    max-height: 600px;
}

button {
    background: #22c55e;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px;
}

button:hover {
    background: #16a34a;
}

input {
    padding: 10px;
    border-radius: 6px;
    border: none;
    margin: 10px;
    width: 200px;
}

li {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid #475569;
}

#gameStatus {
    color: #facc15;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🏎️ DEVOPS RACER</h1>
<h2>Score: <span id="score">0</span></h2>
<p id="gameStatus">Use ← and → to drive</p>

<div>
    <input id="playerName" type="text" placeholder="Enter your player name">
</div>

<div class="container">

    <div>
        <canvas id="game" width="400" height="600"></canvas>
        <br>
        <button onclick="restartGame()">Restart Game</button>
    </div>

    <div class="panel">
        <h2>🏆 Leaderboard</h2>
        <ol id="leaderboard"></ol>
        <button onclick="loadLeaderboard()">Refresh</button>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {
    x: 175,
    y: 500,
    width: 50,
    height: 80,
    speed: 6
};

let enemies = [];
let score = 0;
let gameOver = false;
let keys = {};
let scoreSaved = false;
let roadOffset = 0;

document.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
    }
    keys[e.key] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

function drawRoad() {
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 0, 400, 600);

    ctx.fillStyle = "#22c55e";
    ctx.fillRect(0, 0, 95, 600);
    ctx.fillRect(305, 0, 95, 600);

    ctx.fillStyle = "white";
    ctx.fillRect(95, 0, 5, 600);
    ctx.fillRect(300, 0, 5, 600);

    ctx.fillStyle = "#ffffff";

    for (let y = -50; y < 600; y += 100) {
        ctx.fillRect(195, y + roadOffset, 10, 50);
    }

    roadOffset += 5;

    if (roadOffset >= 100) {
        roadOffset = 0;
    }
}

function drawCar(car, color) {
    ctx.fillStyle = color;
    ctx.fillRect(car.x, car.y, car.width, car.height);

    ctx.fillStyle = "#bae6fd";
    ctx.fillRect(car.x + 8, car.y + 12, 34, 20);

    ctx.fillStyle = "#111";
    ctx.fillRect(car.x - 4, car.y + 10, 6, 18);
    ctx.fillRect(car.x + 48, car.y + 10, 6, 18);
    ctx.fillRect(car.x - 4, car.y + 55, 6, 18);
    ctx.fillRect(car.x + 48, car.y + 55, 6, 18);

    ctx.fillStyle = "#fef08a";
    ctx.fillRect(car.x + 5, car.y + 3, 10, 5);
    ctx.fillRect(car.x + 35, car.y + 3, 10, 5);
}

function createEnemy() {
    const lanes = [115, 175, 235];

    enemies.push({
        x: lanes[Math.floor(Math.random() * lanes.length)],
        y: -100,
        width: 50,
        height: 80,
        speed: 5
    });
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function update() {
    if (gameOver) return;

    if (keys["ArrowLeft"] && player.x > 105) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] && player.x < 245) {
        player.x += player.speed;
    }

    enemies.forEach(enemy => {
        enemy.y += enemy.speed;

        if (collision(player, enemy)) {
            gameOver = true;
            document.getElementById("gameStatus").innerText =
                "GAME OVER! Score: " + score;
            saveScore();
        }
    });

    enemies = enemies.filter(enemy => enemy.y < 650);

    if (!gameOver) {
        score++;
        document.getElementById("score").innerText = score;
    }
}

function gameLoop() {
    drawRoad();

    if (!gameOver) {
        update();
    }

    drawCar(player, "#22c55e");

    enemies.forEach(enemy => {
        drawCar(enemy, "#ef4444");
    });

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, 400, 600);

        ctx.fillStyle = "white";
        ctx.font = "bold 40px Arial";
        ctx.fillText("GAME OVER", 75, 280);

        ctx.font = "24px Arial";
        ctx.fillText("Score: " + score, 145, 330);
    }

    requestAnimationFrame(gameLoop);
}

async function saveScore() {
    if (scoreSaved) return;

    scoreSaved = true;

    const playerName =
        document.getElementById("playerName").value.trim() || "Anonymous";

    try {
        const response = await fetch("/score", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                player: playerName,
                score: score
            })
        });

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        document.getElementById("gameStatus").innerText =
            "Score saved successfully!";

        loadLeaderboard();

    } catch (error) {
        document.getElementById("gameStatus").innerText =
            "Failed to save score";

        console.error(error);
    }
}

async function loadLeaderboard() {
    try {
        const response = await fetch("/leaderboard");

        if (!response.ok) {
            throw new Error("Leaderboard API failed");
        }

        const data = await response.json();

        const list = document.getElementById("leaderboard");
        list.innerHTML = "";

        data.forEach(entry => {
            const li = document.createElement("li");
            li.textContent = entry.player + " — " + entry.score;
            list.appendChild(li);
        });

    } catch (error) {
        console.error("Leaderboard error:", error);
    }
}

function restartGame() {
    player.x = 175;
    enemies = [];
    score = 0;
    gameOver = false;
    scoreSaved = false;
    roadOffset = 0;

    document.getElementById("score").innerText = 0;
    document.getElementById("gameStatus").innerText =
        "Use ← and → to drive";
}

setInterval(() => {
    if (!gameOver) {
        createEnemy();
    }
}, 1200);

loadLeaderboard();
gameLoop();

</script>

</body>
</html>
